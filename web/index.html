<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>WalchandOnGo — Campus Navigation</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%231a73e8'/><text x='16' y='23' font-family='sans-serif' font-size='19' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="map"></div>

<aside class="sidebar" id="sidebar">

  <header class="brand">
    <div class="brand-mark">W</div>
    <div>
      <h1>WalchandOnGo</h1>
      <p>Walchand College of Engineering, Sangli</p>
    </div>
    <button class="collapse" id="collapseBtn" title="Hide panel" aria-label="Hide panel">&#9664;</button>
  </header>

  <section class="search-card">
    <div class="field-rail" aria-hidden="true">
      <span class="dot dot-start"></span>
      <span class="rail"></span>
      <span class="dot dot-end"></span>
    </div>

    <div class="fields">
      <div class="field">
        <input id="fromInput" type="text" placeholder="Choose starting point" autocomplete="off" spellcheck="false">
        <div class="results" id="fromResults"></div>
      </div>
      <div class="field">
        <input id="toInput" type="text" placeholder="Choose destination" autocomplete="off" spellcheck="false">
        <div class="results" id="toResults"></div>
      </div>
    </div>

    <button class="swap" id="swapBtn" title="Swap start and destination" aria-label="Swap">&#8645;</button>
  </section>

  <p class="hint" id="hint">Search for a place, or click anywhere on the map to drop a point.</p>

  <section class="summary" id="summary" hidden>
    <div class="summary-main">
      <span class="summary-time" id="summaryTime"></span>
      <span class="summary-dist" id="summaryDist"></span>
    </div>
    <p class="summary-note" id="summaryNote"></p>
  </section>

  <ol class="steps" id="steps"></ol>

  <footer class="credits">
    Map data &copy; OpenStreetMap contributors
  </footer>
</aside>

<button class="reopen" id="reopenBtn" hidden aria-label="Show panel">&#9654;</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
